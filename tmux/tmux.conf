set -a terminal-features "tmux-256color:RGB"
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=black bg=white  "
set -g status-interval 5
set -g status-left-length 25
set -g status-left "#S"
set -g status-right ""

bind-key -n C-f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key t run-shell -b "tmux set -g status-right '#(~/.config/tmux/elapsed.sh)'; sleep 2; tmux set -g status-right ''"

bind r source-file "~/.config/tmux/tmux.conf"
bind g run "~/.config/tmux/open-github.sh"
bind b set -g status

# Resizing
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# Selection
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
